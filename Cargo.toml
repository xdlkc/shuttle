[package]
name = "shuttle"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
description = "Local GitHub issue and PR dispatcher for coding agents"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
sha2 = "0.11.1"
regex = "1.13.1"

[dev-dependencies]
tempfile = "3"
